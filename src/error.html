<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Gangguan — Al-Ye'AnDiMo</title>
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			body {
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				background: #000;
				color: #fff;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.container {
				max-width: 480px;
				padding: 2rem;
				text-align: center;
			}
			.status {
				font-size: 6rem;
				font-weight: 900;
				color: rgba(255,255,255,0.08);
				line-height: 1;
				margin-bottom: 1rem;
				letter-spacing: 0.05em;
			}
			h1 {
				font-size: 1.5rem;
				font-weight: 800;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				margin-bottom: 0.75rem;
			}
			p {
				font-size: 0.875rem;
				color: rgba(255,255,255,0.5);
				line-height: 1.6;
				margin-bottom: 2rem;
			}
			.reload-btn {
				display: inline-block;
				padding: 0.75rem 2rem;
				border: 1px solid rgba(255,255,255,0.2);
				border-radius: 1rem;
				background: rgba(255,255,255,0.05);
				color: #fff;
				font-size: 0.75rem;
				font-weight: 800;
				letter-spacing: 0.15em;
				text-transform: uppercase;
				text-decoration: none;
				cursor: pointer;
				transition: background 0.2s;
			}
			.reload-btn:hover {
				background: rgba(255,255,255,0.1);
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="status">%sveltekit.status%</div>
			<h1>Mohon Maaf</h1>
			<p>Terjadi gangguan pada sistem. Silakan coba kembali.</p>
			<a href="/" class="reload-btn">Muat Ulang</a>
		</div>
	</body>
</html>
